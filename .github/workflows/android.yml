name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          set -e
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties app/src/main/AndroidManifest.xml app/proguard-rules.pro gradlew; do [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }; done
          if grep -rnI -E 'TODO\(\)|FIXME|PLACEHOLDER|rest of code' --include='*.kt' --include='*.kts' . ; then echo "::error::Placeholder"; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Keystore and Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-configuration-cache -Djava.awt.headless=true

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: apphubpro-apk
          path: out/*.apk
